name: MVP checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --project services/voice-agent
      - run: npm test
      - run: npm run test:agent
      - run: uv run --frozen --project services/voice-agent ruff check services/voice-agent
      # Temporary formatting handoff: print JSON-escaped source from the formatter in CI logs.
      # This step will be removed immediately after committing the formatted files.
      - name: Generate formatted source for PR handoff
        run: |
          uv run --frozen --project services/voice-agent ruff format services/voice-agent
          python - <<'PY'
          import json
          from pathlib import Path
          paths = (
              "services/voice-agent/src/eng_teacher/agent.py",
              "services/voice-agent/src/eng_teacher/controls.py",
              "services/voice-agent/src/eng_teacher/providers.py",
              "services/voice-agent/src/eng_teacher/tutor.py",
              "services/voice-agent/tests/test_lifecycle.py",
              "services/voice-agent/tests/test_tutor.py",
          )
          for path in paths:
              print("FORMATTED_FILE_JSON:" + json.dumps({"path": path, "content": Path(path).read_text(encoding="utf-8")}, ensure_ascii=True))
          PY
      - run: uv run --frozen --project services/voice-agent ruff format --check services/voice-agent
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
